plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "om.balaj.lrc"
    compileSdk 34

    defaultConfig {
        applicationId "om.balaj.lrc"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir("generated/web"))
        }
    }
}

def webRoot = rootProject.file("..")

tasks.register("copyWeb", Copy) {
    from(webRoot) {
        include "index.html"
        include "manifest.json"
        include "sw.js"
        include "css/**"
        include "js/**"
        include "assets/**"
        exclude "android/**"
        exclude "node_modules/**"
        exclude "tests/**"
        exclude "supabase/**"
    }
    into(layout.buildDirectory.dir("generated/web/www"))
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
        task.dependsOn("copyWeb")
    }
}
